[package]
name = "vrct-speech-server"
version = "0.0.0"
description = "Owns the bundled speech.cpp server processes of VRCT-VOX: start, stop, restart and liveness"
edition = "2021"
publish = false

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.10.9"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# A stand-in for the speech.cpp executable that the integration tests start. It is
# never part of an application build: a dependent crate does not build this target.
[[bin]]
name = "fake-speech"
path = "tests/fixture/fake_speech.rs"
test = false
doc = false
