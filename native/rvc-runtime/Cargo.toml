[package]
name = "rvc-runtime"
version = "0.1.0"
description = "Inference-only RVC voice conversion runtime for VRCT-VOX"
edition = "2021"
rust-version = "1.92"
license = "MIT"
publish = false

[lib]
name = "rvc_runtime"

[[bin]]
name = "rvc-infer"
path = "src/bin/rvc_infer.rs"

[features]
default = []
# Run the ONNX graphs on CUDA when the ONNX Runtime build provides it.
cuda = ["ort/cuda"]

[dependencies]
hound = "3.5"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native", "copy-dylibs", "api-17"] }
prost = "0.14"
rustfft = "6.4"
thiserror = "2"

[profile.dev]
opt-level = 2

[profile.release]
lto = "thin"

# This crate is not part of any workspace (the application crate lives in src-tauri).
[workspace]
