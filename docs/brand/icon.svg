<title id="title">VRCT-VOX — Caption Console</title>
<desc id="desc">A large microphone with caption lines anchors a blue console. A four-tool dock below it contains the speaker, conversion waveform, scanned chat bubble, and 文/A translation pair. The large icon literally shows the five functions, while the small mark keeps the microphone and two caption lines.</desc>
