<script>const VIEWS=[{"id": "overview", "tab": "全体構成", "status": "現在の実装を俯瞰", "note": "Pythonが操作を受け持ち、推論は別プロセス、音声の合流はOSに分けています。図の矢印は主要な要求・出力を示します。", "facts": [["画面と制御", "React / Tauri → stdin・stdoutのJSON → Python。"], ["文字と音声は別経路", "OSCは文字を送り、音声は仮想マイクからVRChatへ。"], ["採用は条件付き", "構成Bを検証中。Windows・混在負荷の合格は未確定。"]], "syntax": "infographic relation-dagre-flow-lr-badge-card\ndata\n  title VRCT-VOX｜4つの責務に分ける\n  desc UI・アプリ制御・外部推論・OS音声経路\n  nodes\n    - id ui\n      label React / Tauri\n      desc 入力・設定・字幕\n      icon screen\n    - id py\n      label Python sidecar\n      desc Main → Controller\n      icon code\n    - id text\n      label 既存の文字処理\n      desc 翻訳・履歴・overlay\n      icon text\n    - id engine\n      label speech.cpp\n      desc TTS / ASR / VAD\n      icon chip\n    - id os\n      label OS音声経路\n      desc Linux：PipeWire\n      icon route\n    - id chat\n      label VRChat Chatbox\n      desc 文字の表示\n      icon text\n    - id voice\n      label VRChat マイク\n      desc 音声の入力\n      icon mic\n  relations\n    ui - JSON -> py\n    py - 文字 -> text\n    py - HTTP / WS -> engine\n    engine - TTS音声 -> os\n    text - OSC -> chat\n    os - 仮想マイク -> voice\ntheme\n  palette #176b80 #42659b #665fa4 #217d65 #a46e20\n  base\n    text\n      font-family Noto Sans CJK JP, Yu Gothic, sans-serif"}, {"id": "tts", "tab": "テキスト → 音声", "status": "Linuxの限定実機試験済み", "note": "原文TTSは翻訳を待たず、訳文TTSは選んだ言語の結果を使います。音声待ちで既存の文字配信を止めない構成です。", "facts": [["専用worker", "待機は最大4件。HTTPと再生はTTS workerが担当。"], ["停止を優先", "TTS停止は通常の要求queueを迂回して通知。"], ["計測の境界", "UI→PCM writeを測定。耳までの遅延は別途確認。"]], "syntax": "infographic relation-dagre-flow-lr-badge-card\ndata\n  title テキストを声にする\n  desc 原文か選択した訳文を、ひとつのTTS workerへ\n  nodes\n    - id input\n      label テキスト入力\n      desc メッセージIDを確定\n      icon text\n    - id orig\n      label 原文を選択\n      desc 翻訳完了を待たない\n      icon text\n    - id trans\n      label 訳文を選択\n      desc 既存翻訳provider\n      icon code\n    - id queue\n      label VoiceEventBus\n      desc 重複排除・期限・取消\n      icon queue\n    - id tts\n      label speech.cpp TTS\n      desc localhost HTTP → PCM\n      icon chip\n    - id sink\n      label 仮想マイク\n      desc TTS枝 → 合流 → 全体gate\n      icon route\n    - id vrc\n      label VRChat\n      desc 選択したマイクから取得\n      icon mic\n  relations\n    input - 原文モード -> orig\n    input - 訳文モード -> trans\n    orig - 確定文 -> queue\n    trans - 選択訳 -> queue\n    queue - 要求 -> tts\n    tts - 音声 -> sink\n    sink - OS入力 -> vrc\ntheme\n  palette #176b80 #42659b #665fa4 #217d65 #a46e20\n  base\n    text\n      font-family Noto Sans CJK JP, Yu Gothic, sans-serif"}, {"id": "translated", "tab": "マイク → 翻訳発声", "status": "実装済み・native受入は未完了", "note": "途中の認識結果は字幕を更新し、確定したmicの翻訳成功結果だけを発声します。受信音声から発声する経路は設けていません。", "facts": [["確定した結果だけ", "partialは字幕用。翻訳失敗時に原文発声へ戻さない。"], ["古い結果を捨てる", "mic停止・設定変更で世代を無効化。発声開始期限は5秒。"], ["直接音声を抑止", "既定はモード中の直接枝をミュート。動的duckingは未実装。"]], "syntax": "infographic relation-dagre-flow-lr-badge-card\ndata\n  title 確定したマイクの訳文を発声する\n  desc Linux managed経路｜実ASR/TTSの受入試験は進行中\n  nodes\n    - id mic\n      label 選択したマイク\n      desc 明示的に取得を開始\n      icon mic\n    - id capture\n      label Linux capture\n      desc 48k → 24k mono\n      icon route\n    - id asr\n      label speech.cpp ASR\n      desc Silero VAD / 別セッション\n      icon chip\n    - id partial\n      label 字幕を更新\n      desc partialを同じ行へ\n      icon screen\n    - id translate\n      label 既存翻訳\n      desc mic finalの成功訳だけ\n      icon code\n    - id tts\n      label TTS worker\n      desc 重複・世代・期限を確認\n      icon queue\n    - id out\n      label 仮想マイク\n      desc speech.cpp TTS → OS出力\n      icon mic\n  relations\n    mic - PCM -> capture\n    capture - WebSocket -> asr\n    asr - partial -> partial\n    asr - final -> translate\n    translate - 選択訳 -> tts\n    tts - 音声生成 -> out\ntheme\n  palette #176b80 #42659b #665fa4 #217d65 #a46e20\n  base\n    text\n      font-family Noto Sans CJK JP, Yu Gothic, sans-serif"}, {"id": "direct", "tab": "直接音声とVC", "status": "本体は転送まで・Seed-VCは別PoC", "note": "ASRや翻訳を通らない独立経路です。転送できたことと、声が正しく変換されたことは別に確認します。Seed-VCの製品接続はまだありません。", "facts": [["本体の実装", "SourceBridgeは選択sourceを転送。conversion_verifiedはfalse。"], ["独立したPoC", "Seed-VCは実変換を試験済み。品質・本体統合は未完。"], ["独立した停止", "直接枝だけ停止可能。全体gateはTTSとの合流後に置く。"]], "syntax": "infographic relation-dagre-flow-lr-badge-card\ndata\n  title 直接音声は翻訳を待たない\n  desc 実線は本体の経路｜孤立したSeed-VCは未接続のPoC\n  nodes\n    - id source\n      label 選択source\n      desc 物理入力 / 外部VC出力等\n      icon mic\n    - id bridge\n      label SourceBridge\n      desc 変換状態は保証しない\n      icon route\n    - id branch\n      label 直接音声gate\n      desc vrct.managed.vc\n      icon route\n    - id tts\n      label TTS枝\n      desc vrct.managed.tts\n      icon chip\n    - id mix\n      label 合流と全体gate\n      desc 仮想endpointを保持\n      icon queue\n    - id vrc\n      label VRChat\n      desc 仮想マイクを選択\n      icon mic\n    - id poc\n      label Seed-VC：別PoC\n      desc GPL / 本体統合は未完\n      icon experiment\n  relations\n    source - 音声 -> bridge\n    bridge - 転送 -> branch\n    branch - 直接枝 -> mix\n    tts - TTS枝 -> mix\n    mix - 音声 -> vrc\ntheme\n  palette #176b80 #42659b #665fa4 #217d65 #a46e20\n  base\n    text\n      font-family Noto Sans CJK JP, Yu Gothic, sans-serif"}];const SNAPSHOTS={"overview": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"3.8062755798090038 -20.6875 1332.3874488403821 372.375\" font-family=\"Noto Sans CJK JP, Yu Gothic, sans-serif\" width=\"1332.3874488403821\" height=\"372.375\" style=\"\"><defs/><defs id=\"infographic-defs\"><symbol xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" id=\"rsc-1586587560\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"13\" rx=\"2\"/><path d=\"M8 21h8M12 16v5\"/><\/symbol><symbol xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" id=\"rsc-821170903\"><path d window.renderErrors=[];window.readyView=null;let chart=null;let active='overview';
if(window.AntVInfographic){AntVInfographic.registerResourceLoader(config=>AntVInfographic.loadSVGResource('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+(paths[config.data]||paths.chip)+'</svg>'));}
function show(id){
 active=id;window.readyView=null;const v=VIEWS.find(v=>v.id===id);document.querySelector('#status').textContent=v.status;document.querySelector('#note').textContent=v.note;document.querySelector('#syntax').textContent=v.syntax;
 document.querySelector('#container').setAttribute('aria-label',v.tab+'。'+v.note);
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===id)));
 document.querySelector('.facts').replaceChildren(...v.facts.map(([label,body])=>{const el=document.createElement('div');el.className='fact';const strong=document.createElement('strong');strong.textContent=label;const p=document.createElement('p');p.textContent=body;el.append(strong,p);return el;}));
 if(chart){chart.destroy();chart=null;}document.querySelector('#container').replaceChildren();
 if(window.AntVInfographic){chart=new AntVInfographic.Infographic({container:'#container',width:'100%',height:'100%',padding:30});window.chart=chart;chart.on('error',e=>{window.renderErrors.push(String(e));document.querySelector('#error').textContent='描画に失敗しました。保存済みSVGを参照してください。'});chart.on('warning',e=>window.renderErrors.push(JSON.stringify(e)));chart.on('rendered',()=>{window.readyView=id;});chart.render(v.syntax);}
 else if(SNAPSHOTS[id]){document.querySelector('#container').innerHTML=SNAPSHOTS[id];window.readyView=id;}
 else{document.querySelector('#error').textContent='描画ライブラリを読み込めませんでした。同じフォルダのSVGをご覧ください。';}
}
for(const v of VIEWS){const b=document.createElement('button');b.textContent=v.tab;b.dataset.view=v.id;b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>show(v.id));document.querySelector('nav').append(b);}
document.querySelector('#export').addEventListener('click',async()=>{let url=chart?await chart.toDataURL({type:'svg',embedResources:true}):'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(SNAPSHOTS[active]);const a=document.createElement('a');a.href=url;a.download='vrct-architecture-'+active+'.svg';a.click();});
document.fonts.ready.then(()=>show('overview'));
