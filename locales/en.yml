    ocr:
        section_title: "VRChat Chat Transcribe"
        section_desc: "Capture VRChat chat bubbles on screen and route the recognized text through the existing translation pipeline. Output is mirrored to the main message log and the SteamVR overlay; it is never sent to VRChat's OSC chatbox."
        capture_target: "Capture target"
        language: "Language"
        performance: "Performance"
        window_title:
            label: "Window name"
            desc: "Substring match (case-insensitive) against visible window titles. Change this if you run a client whose window isn't titled 'VRChat' (e.g. a modified launcher)."
        source_language:
            label: "Source language"
            desc: "Language of the captured bubbles. 'auto' reads Japanese, English, Chinese and Latin-script languages with a single model. Hangul, Cyrillic, Thai, Arabic and Devanagari need a separate model, so pick that script. Changing it while running switches over without a restart. Arabic accuracy is currently low."
