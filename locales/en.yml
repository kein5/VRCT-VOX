            label: "Capture interval (ms)"
            desc: "How often the loop grabs a new frame. Lower = more responsive, higher CPU/GPU. Default: 750."
        min_confidence:
            label: "Minimum confidence"
            desc: "Words below this confidence score are discarded. Raise to reduce false positives; lower to catch faint bubbles. Default: 0.85."
        bubble_min_text_length:
