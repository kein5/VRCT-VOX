name: Windows installer update scenarios

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src-tauri/nsis/**'
      - 'tests/installer/**'
      - '.github/workflows/installer-update-tests.yml'

permissions:
  contents: read

jobs:
  windows-update:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: windows-installer-tests
      - name: Install build dependencies
        run: npm ci
      - name: Windows tar outside the ANSI code page
        run: |
          python tests/installer/windows_update_scenarios.py --mode tar
          exit $LASTEXITCODE
      - name: Prepare disposable checkout and build stubs
        run: python tests/installer/windows_update_scenarios.py --mode prepare --port 18765
      - name: Build real NSIS installer
        id: build
        run: |
          npx tauri build --debug --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installers = @(Get-ChildItem src-tauri/target/debug/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer" }
          "INSTALLER=$($installers[0].FullName)" >> $env:GITHUB_ENV
      - name: Silent install, update, rollback and recovery scenarios
        run: |
          python tests/installer/windows_update_scenarios.py --mode silent --installer "$env:INSTALLER" --port 18765
          exit $LASTEXITCODE
      - name: Install wizard test driver
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python -m pip install pywinauto==0.6.9
      - name: GUI default uninstall-before-installing failure scenario
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python tests/installer/windows_update_scenarios.py --mode gui --installer "$env:INSTALLER" --port 18765
          exit $LASTEXITCODE
      - name: Save HTTP and wizard diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-installer-update-diagnostics
          path: |
            .review/tmp/windows-update/**/http-requests.json
            .review/tmp/windows-update/**/gui-controls.json
            .review/tmp/windows-update/**/partial-probe.log
          if-no-files-found: ignore
          retention-days: 7
