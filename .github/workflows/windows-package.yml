# The full candidate build runs on pull requests into main. This catches a change to
# how the backend is packaged earlier, when the change is still small.
name: Windows backend package

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '**/*.spec'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'bat/**'
      - 'tools/check_voice_distribution.py'
      - 'src-python/packaged_self_check.py'
      - '.github/workflows/windows-package.yml'

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: npm run setup-python
      - run: npm run build-python
      - name: Inspect the backend
        shell: pwsh
        run: |
          python tools/check_voice_distribution.py src-tauri/bin/_internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The inspection reads files. This starts the packaged backend and imports what the
      # features import only when they turn on (the translation tokenizer never loaded
      # from a Windows package up to 0.1.0-beta.7, and no check started it).
      - name: Self-check the packaged backend
        shell: pwsh
        run: |
          & src-tauri/bin/vrct-vox-sidecar-x86_64-pc-windows-msvc.exe --self-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
