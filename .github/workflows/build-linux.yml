name: VRCT-VOX Linux candidate (no publication)

on:
  workflow_dispatch:
    inputs:
      speech_variant:
        description: Fixed speech.cpp engine (no models)
        type: choice
        options: [linux-x64-vulkan, linux-x64-cpu]
        default: linux-x64-vulkan
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'src-python/**'
      - 'src-tauri/**'
      - 'src-ui/**'
      - 'locales/**'
      - '*.html'
      - 'vite.config.js'
      - 'native/**'
      - 'config/pipewire/**'
      - 'integrations/**'
      - 'spec/backend_linux.spec'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'package*.json'
      - 'packaging/appimage/**'
      - 'tools/**'
      - 'tests/**'
      - 'licenses/**'
      - 'docs/voice-stack/speechcpp-bundle-artifacts.json'
      - 'docs/voice-stack/appimage-tools.json'
      - 'docs/voice-stack/appimage.md'
      - 'docs/voice-stack/linux-build-pipeline.md'
      - 'docs/voice-stack/local-setup-linux.md'
      - 'docs/voice-stack/licensing.md'
      - 'LICENSE'
      - 'NOTICE.md'

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # id-token and attestations sign the build provenance of a manual candidate (second security
    # audit SEC-04). Pull requests from forks get read-only tokens, and the step skips PRs.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      CARGO_BUILD_JOBS: '4'
      SPEECH_VARIANT: ${{ inputs.speech_variant || 'linux-x64-vulkan' }}
      UV_PYTHON: '3.11'
    steps:
      # The tar.gz, the AppDir and the AppImage together nearly fill the
      # runner disk; drop preinstalled SDKs this job never uses.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: System build and runtime dependencies
        run: |
          packages="build-essential pkg-config binutils libwebkit2gtk-4.1-dev libssl-dev
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev
            pipewire-bin libvulkan1 libglfw3 libportaudio2 libasound2-dev
            webkit2gtk-driver xvfb xauth x11-utils dbus-x11 fonts-noto-cjk
            desktop-file-utils libgtk-3-dev libgdk-pixbuf-2.0-dev glib-networking
            imagemagick xdotool meson ninja-build libsndfile1-dev libglib2.0-dev liblua5.4-dev rpm"
          # The runner's package mirror sometimes cannot be resolved for a while. Try again before failing the job.
          for attempt in 1 2 3 4; do
            sudo apt-get update && sudo apt-get install -y $packages && break
            if [ "$attempt" = 4 ]; then exit 1; fi
            sleep $((attempt * 20))
          done
      - name: Prepare tested PipeWire API in an isolated prefix
        run: |
          bash tools/ci/setup_pipewire.sh "$RUNNER_TEMP/vrct-pipewire"
          cat "$RUNNER_TEMP/vrct-pipewire/environment" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/vrct-pipewire/prefix/bin" >> "$GITHUB_PATH"
      - name: Build isolated candidate with pinned speech.cpp
        run: |
          uv run --no-project --python 3.11 python tools/build_linux.py \
            --python 3.11 --variant "$SPEECH_VARIANT" --download-speech \
            --appimage --download-appimage-tools \
            > linux-build.log 2>&1
      - name: Contracts and archive integrity
        run: |
          uv run --no-project --python build/linux/venv/bin/python python -m pytest \
            -c tests/voice/pytest.ini tests/voice/test_linux_package.py tests/voice/test_runtime_paths.py \
            tests/voice/test_distribution_artifacts.py tests/voice/test_fork_distribution_identity.py \
            tests/voice/test_appimage.py -q
          cd build/linux/artifacts
          sha256sum -c ./*.tar.gz.sha256
          sha256sum -c ./*.AppImage.sha256
      - name: Install pinned GUI test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Relocated read-only package acceptance
        env:
          VRCT_TEST_NATIVE_GUI: '1'
          VRCT_TEST_XVFB: '1'
          GDK_BACKEND: x11
        run: |
          export VRCT_TEST_DRIVER="$HOME/.cargo/bin/tauri-driver"
          export VRCT_TEST_LINUX_ARCHIVE="$(realpath build/linux/artifacts/*.tar.gz)"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            uv run --no-project --python build/linux/venv/bin/python python -m pytest \
            -c tests/voice/pytest.ini tests/platform/test_linux_package.py -q \
            --basetemp=build/linux/acceptance > linux-acceptance.log 2>&1
      - name: AppImage extract-and-run acceptance
        env:
          VRCT_TEST_NATIVE_GUI: '1'
          VRCT_TEST_XVFB: '1'
          GDK_BACKEND: x11
        run: |
          export VRCT_TEST_DRIVER="$HOME/.cargo/bin/tauri-driver"
          export VRCT_TEST_APPIMAGE="$(realpath build/linux/artifacts/*.AppImage)"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            uv run --no-project --python build/linux/venv/bin/python python -m pytest \
            -c tests/voice/pytest.ini tests/platform/test_appimage.py -q \
            --basetemp=build/linux/appimage-acceptance > appimage-acceptance.log 2>&1
      # The same files as the tar.gz, installed under /opt/vrct-vox (tools/linux_packages.py).
      - name: Build deb and rpm packages
        run: python3 tools/linux_packages.py --candidate build/linux/candidate/VRCT-VOX --output-dir build/linux/artifacts
      # Clean images pinned by digest; each installs with its own package manager and only the
      # declared requirements.
      - name: Install the packages in clean Ubuntu, Debian and Fedora
        run: |
          for image in \
            ubuntu:24.04@sha256:2198e4c65076e9cb0b3d695219df667c0e3b0072da64ca3c2648aca17dcecaf5 \
            debian:13@sha256:9c6e381421d0f48d1b8133e573f33c185ee16cbf505eda9c4a8a4791b25ea8a6; do
            docker run --rm -v "$PWD/build/linux/artifacts:/packages:ro" -v "$PWD/tools/ci:/ci:ro" "$image" \
              bash /ci/check_linux_package.sh /packages/"$(basename build/linux/artifacts/*.deb)"
          done
          docker run --rm -v "$PWD/build/linux/artifacts:/packages:ro" -v "$PWD/tools/ci:/ci:ro" \
            fedora:44@sha256:15da97ed9aa94dd3d92c3925eb89520f6c80e07ea7ee24cba848d1f8b6912b3e \
            bash /ci/check_linux_package.sh /packages/"$(basename build/linux/artifacts/*.rpm)"
      - name: Record immutable candidate identity and hashes
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python tools/release_candidate.py stage build/linux/release-candidate --platform linux --commit "$CANDIDATE_COMMIT" \
            --asset build/linux/artifacts/*.AppImage --asset build/linux/artifacts/*.tar.gz \
            --asset build/linux/artifacts/*.deb --asset build/linux/artifacts/*.rpm
          python tools/release_candidate.py verify build/linux/release-candidate --platform linux --commit "$CANDIDATE_COMMIT"
      # Signed build provenance (GitHub Artifact Attestations, Sigstore) for every candidate file:
      # it names this workflow, the commit and the run. prepare-release.yml refuses files without it.
      - name: Attest the candidate files
        if: github.event_name == 'workflow_dispatch'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/linux/release-candidate/*
      # Candidate storage only. No release creation, package registry, or secrets.
      - name: Store inspected candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-linux-x86_64-candidate
          path: build/linux/release-candidate/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Store diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-linux-build-logs
          retention-days: 7
          path: |
            linux-build.log
            linux-acceptance.log
            appimage-acceptance.log
            build/linux/pyinstaller/backend_linux/warn-backend_linux.txt
            build/linux/acceptance/**/*.log
            build/linux/appimage-acceptance/**/*.log
            build/linux/appimage-acceptance/**/normal-window-*.png
            build/linux/appimage-acceptance/**/normal-window-metrics.json
