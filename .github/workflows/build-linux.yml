name: VRCT-VOX Linux candidate (no publication)

on:
  workflow_dispatch:
    inputs:
      speech_variant:
        description: Fixed speech.cpp engine (no models)
        type: choice
        options: [linux-x64-vulkan, linux-x64-cpu]
        default: linux-x64-vulkan
  pull_request:
    paths:
      - '.github/workflows/build-linux.yml'
      - 'src-python/**'
      - 'src-tauri/**'
      - 'src-ui/**'
      - 'locales/**'
      - '*.html'
      - 'vite.config.js'
      - 'native/**'
      - 'config/pipewire/**'
      - 'integrations/**'
      - 'spec/backend_linux.spec'
      - 'requirements*'
      - 'package*.json'
      - 'packaging/appimage/**'
      - 'tools/**'
      - 'tests/**'
      - 'licenses/**'
      - 'docs/voice-stack/speechcpp-bundle-artifacts.json'
      - 'docs/voice-stack/appimage-tools.json'
      - 'docs/voice-stack/appimage.md'
      - 'docs/voice-stack/linux-build-pipeline.md'
      - 'docs/voice-stack/local-setup-linux.md'
      - 'docs/voice-stack/licensing.md'
      - 'LICENSE'
      - 'NOTICE.md'

permissions:
  contents: read

concurrency:
  group: linux-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '4'
      SPEECH_VARIANT: ${{ inputs.speech_variant || 'linux-x64-vulkan' }}
      UV_PYTHON: '3.11'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'
          enable-cache: true
          cache-dependency-glob: requirements-linux-build.lock
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: System build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config binutils libwebkit2gtk-4.1-dev libssl-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libpipewire-0.3-dev \
            pipewire-bin libvulkan1 libglfw3 libportaudio2 libasound2-dev \
            webkit2gtk-driver xvfb xauth x11-utils dbus-x11 fonts-noto-cjk \
            desktop-file-utils libgtk-3-dev libgdk-pixbuf-2.0-dev glib-networking \
            imagemagick xdotool
      - name: Build isolated candidate with pinned speech.cpp
        run: |
          uv run --no-project --python 3.11 python tools/build_linux.py \
            --python 3.11 --variant "$SPEECH_VARIANT" --download-speech \
            --appimage --download-appimage-tools \
            > linux-build.log 2>&1
      - name: Contracts and archive integrity
        run: |
          uv run --no-project --python build/linux/venv/bin/python python -m pytest \
            -c tests/voice/pytest.ini tests/voice/test_linux_package.py tests/voice/test_runtime_paths.py \
            tests/voice/test_distribution_artifacts.py tests/voice/test_fork_distribution_identity.py \
            tests/voice/test_appimage.py -q
          cd build/linux/artifacts
          sha256sum -c ./*.tar.gz.sha256
          sha256sum -c ./*.AppImage.sha256
      - name: Install pinned GUI test driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Relocated read-only package acceptance
        env:
          VRCT_TEST_NATIVE_GUI: '1'
          VRCT_TEST_XVFB: '1'
          GDK_BACKEND: x11
        run: |
          export VRCT_TEST_DRIVER="$HOME/.cargo/bin/tauri-driver"
          export VRCT_TEST_LINUX_ARCHIVE="$(realpath build/linux/artifacts/*.tar.gz)"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            uv run --no-project --python build/linux/venv/bin/python python -m pytest \
            -c tests/voice/pytest.ini tests/platform/test_linux_package.py -q \
            --basetemp=build/linux/acceptance > linux-acceptance.log 2>&1
      - name: AppImage extract-and-run acceptance
        env:
          VRCT_TEST_NATIVE_GUI: '1'
          VRCT_TEST_XVFB: '1'
          GDK_BACKEND: x11
        run: |
          export VRCT_TEST_DRIVER="$HOME/.cargo/bin/tauri-driver"
          export VRCT_TEST_APPIMAGE="$(realpath build/linux/artifacts/*.AppImage)"
          dbus-run-session -- xvfb-run -a -s '-screen 0 1280x900x24' \
            uv run --no-project --python build/linux/venv/bin/python python -m pytest \
            -c tests/voice/pytest.ini tests/platform/test_appimage.py -q \
            --basetemp=build/linux/appimage-acceptance > appimage-acceptance.log 2>&1
      - name: Record immutable candidate identity and hashes
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        run: |
          python tools/release_candidate.py stage build/linux/candidate --platform linux --commit "$CANDIDATE_COMMIT" \
            --asset build/linux/artifacts/*.AppImage --asset build/linux/artifacts/*.tar.gz
          python tools/release_candidate.py verify build/linux/candidate --platform linux --commit "$CANDIDATE_COMMIT"
      # Candidate storage only. No release creation, package registry, or secrets.
      - name: Store inspected candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-linux-x86_64-candidate
          path: build/linux/candidate/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Store diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-linux-build-logs
          retention-days: 7
          path: |
            linux-build.log
            linux-acceptance.log
            appimage-acceptance.log
            build/linux/pyinstaller/backend_linux/warn-backend_linux.txt
            build/linux/acceptance/**/*.log
            build/linux/appimage-acceptance/**/*.log
            build/linux/appimage-acceptance/**/normal-window-*.png
            build/linux/appimage-acceptance/**/normal-window-metrics.json
