# Build candidates only. Draft preparation is a separate manual workflow.
name: Validate VRCT-VOX distribution

on:
  workflow_dispatch:
  # Release pull requests build and inspect the Windows candidate too.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The CPU and CUDA packages build in parallel; the candidate job below
  # inspects both together and records the candidate.
  build:
    name: Windows ${{ matrix.variant }} build
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: true
      matrix:
        include:
          - variant: cpu
            script: release
            package: VRCT-VOX.zip
          - variant: cuda
            script: release-cuda
            package: VRCT-VOX_cuda.zip
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Keep the single-line GITHUB_ENV assignment and artifact paths bounded.
          if ($version -isnot [string] -or $version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') {
            throw 'package.json must contain a single version string such as 1.2.3 or 1.2.3-beta.1'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify candidate version numbers match
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match candidate version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Set every version field to $expected before building."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.13.5'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Both variants compile the same Tauri app; only the CPU job saves.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: windows-tauri
          save-if: ${{ matrix.variant == 'cpu' }}

      - name: Install dependencies
        run: npm ci

      - name: Setup Python environments
        run: npm run setup-python

      - name: Install packaging helper
        run: uv pip install --system tqdm

      - name: Inspect source archive without OCR weights
        if: matrix.variant == 'cpu'
        shell: pwsh
        run: |
          git archive --format=zip --output=VRCT-VOX-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_voice_distribution.py VRCT-VOX-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package ${{ matrix.package }}
        shell: pwsh
        env:
          SCRIPT: ${{ matrix.script }}
        run: npm run $env:SCRIPT

      - name: Inspect the package and its backend
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          python tools/check_voice_distribution.py $env:PACKAGE src-tauri/bin/_internal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect build outputs
        shell: pwsh
        env:
          PACKAGE: ${{ matrix.package }}
          VARIANT: ${{ matrix.variant }}
        run: |
          New-Item -ItemType Directory -Force build/windows-output | Out-Null
          Move-Item $env:PACKAGE build/windows-output/
          if ($env:VARIANT -eq 'cpu') {
            Move-Item "src-tauri/target/release/bundle/nsis/VRCT-VOX_$($env:VERSION)_x64-setup.exe" build/windows-output/
          }

      - name: Hand over build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-${{ matrix.variant }}-build
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: build/windows-output/*

  candidate:
    name: Windows candidate (not a release)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Keep the single-line GITHUB_ENV assignment and artifact paths bounded.
          if ($version -isnot [string] -or $version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') {
            throw 'package.json must contain a single version string such as 1.2.3 or 1.2.3-beta.1'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify candidate version numbers match
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match candidate version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Set every version field to $expected before building."
            exit 1
          }

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Receive build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-*-build
          merge-multiple: true
          path: build/windows-output

      - name: Inspect CPU and CUDA ZIPs and completed NSIS installer
        shell: pwsh
        run: |
          $installer = "build/windows-output/VRCT-VOX_$($env:VERSION)_x64-setup.exe"
          python tools/check_voice_distribution.py build/windows-output/VRCT-VOX.zip build/windows-output/VRCT-VOX_cuda.zip --nsis $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release names and candidate identity
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $installer = "build/windows-output/VRCT-VOX_$($env:VERSION)_x64-setup.exe"
          python tools/release_candidate.py stage build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT --asset build/windows-output/VRCT-VOX.zip --asset build/windows-output/VRCT-VOX_cuda.zip --asset $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_candidate.py verify build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # No Hugging Face upload, telemetry secrets, GitHub Release or publication.
      # Download candidate artifacts from this workflow for Windows acceptance.
      - name: Preserve inspected candidates for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-windows-candidate
          if-no-files-found: error
          retention-days: 7
          path: build/release-candidate/*
