# Build candidates only. Draft preparation is a separate manual workflow.
name: Validate VRCT-VOX distribution

on:
  workflow_dispatch:
  # Release pull requests build and inspect the Windows candidate too.
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Windows candidate (not a release)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          # Keep the single-line GITHUB_ENV assignment and artifact paths bounded.
          if ($version -isnot [string] -or $version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?\z') {
            throw 'package.json must contain a single version string such as 1.2.3 or 1.2.3-beta.1'
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify candidate version numbers match
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match candidate version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match candidate version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Set every version field to $expected before building."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.9.5'

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install dependencies
        run: npm ci

      - name: Setup Python environments
        run: npm run setup-python

      - name: Install packaging helper
        run: uv pip install --system tqdm

      - name: Inspect source archive without OCR weights
        shell: pwsh
        run: |
          git archive --format=zip --output=VRCT-VOX-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_voice_distribution.py VRCT-VOX-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package candidates
        run: npm run release-all

      - name: Inspect CPU and CUDA ZIPs and completed NSIS installer
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/VRCT-VOX_$($env:VERSION)_x64-setup.exe"
          python tools/check_voice_distribution.py VRCT-VOX.zip VRCT-VOX_cuda.zip src-tauri/bin/_internal --nsis $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release names and candidate identity
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $installer = "src-tauri/target/release/bundle/nsis/VRCT-VOX_$($env:VERSION)_x64-setup.exe"
          python tools/release_candidate.py stage build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT --asset VRCT-VOX.zip --asset VRCT-VOX_cuda.zip --asset $installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/release_candidate.py verify build/release-candidate --platform windows --commit $env:CANDIDATE_COMMIT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # No Hugging Face upload, telemetry secrets, GitHub Release or publication.
      # Download candidate artifacts from this workflow for Windows acceptance.
      - name: Preserve inspected candidates for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: VRCT-VOX-windows-candidate
          if-no-files-found: error
          retention-days: 7
          path: build/release-candidate/*
