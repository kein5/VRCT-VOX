# Build candidates only. Publication is a separate, currently disabled gate.
name: Validate VRCT-TTS distribution

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Windows candidate (not a release)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read candidate version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify version numbers match the tag
        shell: pwsh
        run: |
          $expected = $env:VERSION
          $failed = $false

          $pkgVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($pkgVersion -ne $expected) {
            Write-Host "::error::package.json version ($pkgVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tauriVersion -ne $expected) {
            Write-Host "::error::src-tauri/tauri.conf.json version ($tauriVersion) does not match tag version ($expected)"
            $failed = $true
          }

          $configContent = Get-Content src-python/config.py -Raw
          if ($configContent -notmatch 'self\._VERSION\s*=\s*"([^"]+)"') {
            Write-Host "::error::could not find self._VERSION in src-python/config.py"
            $failed = $true
          } elseif ($Matches[1] -ne $expected) {
            Write-Host "::error::src-python/config.py VERSION ($($Matches[1])) does not match tag version ($expected)"
            $failed = $true
          }

          if ($failed) {
            Write-Host "::error::Version mismatch detected. Bump every version field to $expected before tagging."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.15.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.5'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Setup Python environments
        run: npm run setup-python

      - name: Install packaging helper
        run: uv pip install --system tqdm

      - name: Inspect source archive without OCR weights
        shell: pwsh
        run: |
          git archive --format=zip --output=VRCT-TTS-source.zip HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_voice_distribution.py VRCT-TTS-source.zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and package candidates
        run: npm run release-all

      - name: Inspect CPU and CUDA ZIPs and completed NSIS installer
        shell: pwsh
        run: |
          python tools/check_voice_distribution.py VRCT-TTS.zip VRCT-TTS_cuda.zip src-tauri/bin/_internal --nsis "src-tauri/target/release/bundle/nsis/VRCT-TTS_${{ env.VERSION }}_x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $paths = @("VRCT-TTS.zip", "VRCT-TTS_cuda.zip", "src-tauri/target/release/bundle/nsis/VRCT-TTS_${{ env.VERSION }}_x64-setup.exe")
          foreach ($path in $paths) {
            (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLower() | Set-Content "$path.sha256" -Encoding ascii
          }

      # No Hugging Face upload, telemetry secrets, GitHub Release or publication.
      # Download candidate artifacts from this workflow for Windows acceptance.
      - name: Preserve inspected candidates for review
        uses: actions/upload-artifact@v4
        with:
          name: VRCT-TTS-windows-candidate
          if-no-files-found: error
          retention-days: 7
          path: |
            VRCT-TTS*.zip*
            src-tauri/target/release/bundle/nsis/VRCT-TTS_*x64-setup.exe*
