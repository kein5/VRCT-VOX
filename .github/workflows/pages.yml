name: VRCT-VOX user documentation (GitHub Pages)
# Builds site/ on pull requests that touch it. Deploys to GitHub Pages from
# develop, on a push that touches site/ or by hand. Pages must be enabled once in
# the repository settings with "GitHub Actions" as the source.
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [develop]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  # Let a running deployment finish; only superseded PR builds are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: site
      # Fails on dead links.
      - run: npm run build
        working-directory: site
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/.vitepress/dist
  deploy:
    if: github.repository == 'kein5/VRCT-VOX' && github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
