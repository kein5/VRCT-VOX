name: Feature request / 機能の要望
description: Suggest a new feature or an improvement. / 新しい機能や改善を提案する。
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Write in English or Japanese. 英語でも日本語でも構いません。
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case / 困っていること・使い方
      description: What do you want to do, and what gets in the way today? / 何をしたいか、今何が妨げになっているか。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 提案する動作
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Related feature / 関連する機能
      multiple: true
      options:
        - TTS (speech.cpp)
        - Speech recognition / 音声認識
        - Translation / 翻訳
        - Voice conversion (RVC / Seed-VC)
        - VRChat (OSC, chatbox, virtual microphone)
        - Model downloads / モデルの取得
        - Shortcuts, quick chat / ショートカット・入力の小窓
        - VR overlay
        - Install, update, packaging / 導入・更新・配布
        - Other / その他
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / OS
      multiple: true
      options:
        - Windows
        - Linux
        - Any / すべて
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered / 検討した別の方法
    validations:
      required: false
