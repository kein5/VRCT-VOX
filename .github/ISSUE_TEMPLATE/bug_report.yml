name: Bug report / 不具合の報告
description: Something in VRCT-VOX does not work as expected. / VRCT-VOX が期待どおりに動かない。
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Japanese. 英語でも日本語でも構いません。
        Security vulnerabilities must not be reported here: use [private vulnerability reporting](https://github.com/kein5/VRCT-VOX/security/advisories/new) (see SECURITY.md).
        脆弱性はここではなく、非公開の脆弱性報告から送ってください。
  - type: input
    id: version
    attributes:
      label: VRCT-VOX version / 版
      description: Shown at the bottom of the settings screen (e.g. 0.1.0). / 設定画面の左下に表示されています。
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / OS
      options:
        - Windows 11
        - Windows 10
        - Linux (tar.gz)
        - Linux (AppImage)
        - Other / その他
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected feature / 対象の機能
      multiple: true
      options:
        - TTS (speech.cpp)
        - Speech recognition / 音声認識
        - Translation / 翻訳
        - Voice conversion (RVC / Seed-VC)
        - VRChat (OSC, chatbox, virtual microphone)
        - Model downloads / モデルの取得
        - Shortcuts, quick chat / ショートカット・入力の小窓
        - VR overlay
        - Install, update, startup / 導入・更新・起動
        - Other / その他
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened and what did you expect? / 起きたことと期待した動作
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment details / 環境の詳細
      description: GPU and driver, audio devices, VR runtime, speech.cpp model, translation engine. / GPU とドライバー、音声デバイス、VR ランタイム、使ったモデルや翻訳エンジンなど。
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output / ログ
      description: |
        Windows: the `logs` folder next to vrct-vox.exe. Linux: `~/.config/vrct-vox/logs/`.
        Remove API keys, chat text and other personal data before pasting. / API キーや会話の内容などの個人情報は取り除いてください。
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks / 確認
      options:
        - label: I searched existing issues. / 既存の Issue を検索しました。
          required: true
        - label: This happens in VRCT-VOX, not only in upstream VRCT. / 上流の VRCT ではなく VRCT-VOX で起きる問題です。
          required: true
