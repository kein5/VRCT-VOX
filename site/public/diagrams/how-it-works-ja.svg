ー（RVC）</text></g><rect x="830" y="78" width="140" height="46" rx="8" fill="#18233a" stroke="#6ea8ff" stroke-width="1.5"/><g fill="#e6edf7"><text x="900" y="93" text-anchor="middle" dominant-baseline="middle">VRChatの</text><text x="900" y="109" text-anchor="middle" dominant-baseline="middle">チャットボックス</text></g><rect x="830" y="208" width="140" height="46" rx="8" fill="#18233a" stroke="#6ea8ff" stroke-width="1.5"/><g fill="#e6edf7"><text x="900" y="223" text-anchor="middle" dominant-baseline="middle">仮想マイク</text><text x="900" y="239" text-anchor="middle" dominant-baseline="middle">→ VRChatのマイク</text></g><rect x="20" y="388" width="180" height="46" rx="8" fill="#18233a" stroke="#b48cff" stroke-width="1.5"/><g fill="#e6edf7"><text x="110" y="411" text-anchor="middle" dominant-baseline="middle">相手の声（ゲーム音声）</text></g><rect x="20" y="478" width="180" height="46" rx="8" fill="#18233a" stroke="#b48cff" stroke-width="1.5"/><g fill="#e6edf7"><text x="110" y="501" text-anchor="middle" dominant-baseline="middle">相手のチャットボックス</text></g><rect x="235" y="388" width="190" height="46" rx="8" fill="#18233a" stroke="#b48cff" stroke-width="1.5"/><g fill="#e6edf7"><text x="330" y="411" text-anchor="middle" dominant-baseline="middle">音声認識（ASR）</text></g><rect x="235" y="478" width="190" height="46" rx="8" fill="#18233a" stroke="#b48cff" stroke-width="1.5"/><g fill="#e6edf7"><text x="330" y="501" text-anchor="middle" dominant-baseline="middle">チャット読み取り（OCR）</text></g><rect x="455" y="433" width="120" height="46" rx="8" fill="#18233a" stroke="#b48cff" stroke-width="1.5"/><g fill="#e6edf7"><text x="515" y="456" text-anchor="middle" dominant-baseline="middle">翻訳</text></g><rect x="830" y="388" width="140" height="46" rx="8" fill="#18233a" stroke="#b48cff" stroke-width="1.5"/><g fill="#e6edf7"><text x="900" y="403" text-anchor="middle" dominant-baseline="middle">字幕とログ</text><text x="900" y="419" text-anchor="middle" dominant-baseline="middle">（画面・VR）</text></g><rect x="830" y="478" width="140" 